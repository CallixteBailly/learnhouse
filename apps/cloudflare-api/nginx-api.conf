# nginx configuration for the Cloudflare Container (API + collab + content).
# Started with:  nginx -c /tmp/nginx-api.conf -g 'daemon off;'
# Runs as non-root (appuser). Logs go to /tmp files (NOT /dev/stderr or
# /dev/stdout — those char devices don't exist on Cloudflare's runtime and
# make nginx exit with [emerg] open() failed); the entrypoint tails them to
# the container stdout for observability.

pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log notice;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/nginx-access.log;

    client_max_body_size 6G;
    client_body_buffer_size 32k;
    large_client_header_buffers 4 32k;

    # Non-root writable temp paths
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        # Container-class readiness check (pingEndpoint = "ping")
        location = /ping {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        # Collab server (WebSocket)
        location /collab {
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Python backend API
        location /api/v1 {
            proxy_pass http://127.0.0.1:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # Long timeouts for large uploads (SCORM up to several GB)
            # and synchronous video/HLS processing requests.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_request_buffering off;
        }

        # Backend static content delivery
        location /content {
            proxy_pass http://127.0.0.1:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Frontend (Next.js standalone on :3000) — everything else,
        # including /api/auth (NextAuth) and /_next static assets.
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
        }
    }
}
