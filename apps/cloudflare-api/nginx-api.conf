# nginx configuration for the Cloudflare Container (API + collab + content).
# Started with:  nginx -c /etc/nginx/nginx-api.conf -g 'daemon off;'
# Runs as non-root (appuser): pid + temp files live in /tmp, listen port 8080.

pid /tmp/nginx.pid;
error_log /dev/stderr notice;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    client_max_body_size 6G;
    client_body_buffer_size 32k;
    large_client_header_buffers 4 32k;

    # Non-root writable temp paths
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        # Container-class readiness check (pingEndpoint = "ping")
        location = /ping {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        # Collab server (WebSocket)
        location /collab {
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Python backend: /api/v1/*, /content/* and anything else
        location / {
            proxy_pass http://127.0.0.1:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # Long timeouts for large uploads (SCORM up to several GB)
            # and synchronous video/HLS processing requests.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_request_buffering off;
        }
    }
}
