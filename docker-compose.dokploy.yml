# =============================================================================
# Dokploy Compose — OrdIA Learning
# =============================================================================
# Fichier de déploiement pour Dokploy.
#
# Differences vs docker-compose.yml (dev/tunnel):
#   - Pas de service cloudflared (Dokploy gère le routing + SSL/TLS himself)
#   - Domaine paramétré par ${APP_DOMAIN} (injecté par Dokploy)
#   - Secrets via variables d'environnement (pas en dur dans le fichier)
#   - Pas de port exposé directement — Dokploy route via son proxy traefik
#
# Variables requises (à définir dans l'UI Dokploy > Environment):
#   APP_DOMAIN        — ex: ordia.yourdokploy.app
#   JWT_SECRET        — clé secrète JWT (gen: openssl rand -base64 32)
#   NEXTAUTH_SECRET   — clé NextAuth (gen: openssl rand -base64 32)
#   ADMIN_EMAIL       — email admin initial
#   ADMIN_PASSWORD    — mot de passe admin initial
#
# Optionnel:
#   AI_API_KEY        — clé API du provider IA (z.ai / openai)
# =============================================================================

services:
  learnhouse-app:
    build:
      context: .
      dockerfile: Dokploy.Dockerfile
    image: ordia-learning:dokploy
    container_name: ordia-app
    restart: unless-stopped
    environment:
      - HOSTNAME=0.0.0.0
      - LEARNHOUSE_API_URL=http://localhost:9000
      - LEARNHOUSE_DOMAIN=${APP_DOMAIN}
      - HTTP_PORT=80
      - NEXT_PUBLIC_LEARNHOUSE_API_URL=https://${APP_DOMAIN}/api/v1/
      - NEXT_PUBLIC_LEARNHOUSE_BACKEND_URL=https://${APP_DOMAIN}/
      - NEXT_PUBLIC_LEARNHOUSE_DOMAIN=${APP_DOMAIN}
      - NEXT_PUBLIC_LEARNHOUSE_TOP_DOMAIN=${APP_DOMAIN##*.}
      - NEXT_PUBLIC_LEARNHOUSE_MULTI_ORG=False
      - NEXT_PUBLIC_LEARNHOUSE_DEFAULT_ORG=default
      - NEXT_PUBLIC_LEARNHOUSE_HTTPS=True
      - NEXTAUTH_URL=https://${APP_DOMAIN}
      - LEARNHOUSE_SQL_CONNECTION_STRING=postgresql://learnhouse:${DB_PASSWORD:-learnhouse_secure_2024}@db:5432/learnhouse
      - LEARNHOUSE_REDIS_CONNECTION_STRING=redis://redis:6379/learnhouse
      - LEARNHOUSE_REDIS_URL=redis://redis:6379
      - LEARNHOUSE_PORT=9000
      - LEARNHOUSE_AUTH_JWT_SECRET_KEY=${JWT_SECRET}
      - LEARNHOUSE_INITIAL_ADMIN_EMAIL=${ADMIN_EMAIL:-admin@ordia.fr}
      - LEARNHOUSE_INITIAL_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - LEARNHOUSE_INITIAL_ORG_NAME=OrdIA Learning
      - LEARNHOUSE_INITIAL_ORG_SLUG=default
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - COLLAB_INTERNAL_KEY=${COLLAB_KEY:-/yhAnbFEFqbmThB3oUcq7QP5rqSdEeuPfj5jDFWcXw4=}
      - NEXT_PUBLIC_COLLAB_URL=wss://${APP_DOMAIN}/collab
      - LEARNHOUSE_DEVELOPMENT_MODE=False
      - LEARNHOUSE_IS_AI_ENABLED=${AI_ENABLED:-True}
      - LEARNHOUSE_AI_PROVIDER=openai
      - LEARNHOUSE_AI_API_KEY=${AI_API_KEY:-}
      - LEARNHOUSE_AI_BASE_URL=https://api.z.ai/api/coding/paas/v4/
      - LEARNHOUSE_AI_MODEL_FAST=GLM-5-Turbo
      - LEARNHOUSE_AI_MODEL_STANDARD=glm-5.2
      - LEARNHOUSE_AI_MODEL_PRO=GLM-5
      - LEARNHOUSE_CONTENT_DELIVERY_TYPE=filesystem
      - LEARNHOUSE_OSS=true
      - NEXT_PUBLIC_LEARNHOUSE_OSS=true
      - LEARNHOUSE_COOKIE_DOMAIN=.${APP_DOMAIN##*.}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - learnhouse_content:/app/api/content
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - ordia-net

  db:
    image: pgvector/pgvector:pg16
    container_name: ordia-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=learnhouse
      - POSTGRES_PASSWORD=${DB_PASSWORD:-learnhouse_secure_2024}
      - POSTGRES_DB=learnhouse
    volumes:
      - learnhouse_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnhouse"]
      interval: 5s
      timeout: 4s
      retries: 5
    networks:
      - ordia-net

  redis:
    image: redis:7.2.3-alpine
    container_name: ordia-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - learnhouse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 4s
      retries: 5
    networks:
      - ordia-net

volumes:
  learnhouse_db:
  learnhouse_redis_data:
  learnhouse_content:

networks:
  ordia-net:
    driver: bridge
