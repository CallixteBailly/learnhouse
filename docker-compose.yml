services:
  learnhouse-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ordia-learning:latest
    container_name: learnhouse-app-prod
    restart: unless-stopped
    environment:
      - HOSTNAME=0.0.0.0
      - LEARNHOUSE_API_URL=http://localhost:9000
      - LEARNHOUSE_DOMAIN=bunny-harley-borders-nil.trycloudflare.com
      - HTTP_PORT=80
      - NEXT_PUBLIC_LEARNHOUSE_API_URL=https://bunny-harley-borders-nil.trycloudflare.com/api/v1/
      - NEXT_PUBLIC_LEARNHOUSE_BACKEND_URL=https://bunny-harley-borders-nil.trycloudflare.com/
      - NEXT_PUBLIC_LEARNHOUSE_DOMAIN=bunny-harley-borders-nil.trycloudflare.com
      - NEXT_PUBLIC_LEARNHOUSE_TOP_DOMAIN=trycloudflare.com
      - NEXT_PUBLIC_LEARNHOUSE_MULTI_ORG=False
      - NEXT_PUBLIC_LEARNHOUSE_DEFAULT_ORG=default
      - NEXT_PUBLIC_LEARNHOUSE_HTTPS=True
      - NEXTAUTH_URL=https://bunny-harley-borders-nil.trycloudflare.com
      - LEARNHOUSE_SQL_CONNECTION_STRING=postgresql://learnhouse:learnhouse_secure_2024@db:5432/learnhouse
      - LEARNHOUSE_REDIS_CONNECTION_STRING=redis://redis:6379/learnhouse
      - LEARNHOUSE_REDIS_URL=redis://redis:6379
      - LEARNHOUSE_PORT=9000
      - LEARNHOUSE_AUTH_JWT_SECRET_KEY=ezr60eWBaqfkom4JoqP3q57UezYI6evWmQ/12oGcFJ4=
      - LEARNHOUSE_INITIAL_ADMIN_EMAIL=admin@learnhouse.local
      - LEARNHOUSE_INITIAL_ADMIN_PASSWORD=Admin2026
      - LEARNHOUSE_INITIAL_ORG_NAME=OrdIA Learning
      - LEARNHOUSE_INITIAL_ORG_SLUG=default
      - NEXTAUTH_SECRET=AGgrZY1xSaBfl7TpfUtAkMf2L8qrNSlpbRa10WHi970=
      - COLLAB_INTERNAL_KEY=/yhAnbFEFqbmThB3oUcq7QP5rqSdEeuPfj5jDFWcXw4=
      - NEXT_PUBLIC_COLLAB_URL=wss://bunny-harley-borders-nil.trycloudflare.com/collab
      - LEARNHOUSE_DEVELOPMENT_MODE=False
      - LEARNHOUSE_IS_AI_ENABLED=True
      - LEARNHOUSE_AI_PROVIDER=openai
      - LEARNHOUSE_AI_API_KEY=e383fb38aeb142acb8bf1246c6b859d5.S9pp1r1v2O7T1wmE
      - LEARNHOUSE_AI_BASE_URL=https://api.z.ai/api/coding/paas/v4/
      - LEARNHOUSE_AI_MODEL_FAST=GLM-5-Turbo
      - LEARNHOUSE_AI_MODEL_STANDARD=glm-5.2
      - LEARNHOUSE_AI_MODEL_PRO=GLM-5
      - LEARNHOUSE_CONTENT_DELIVERY_TYPE=filesystem
      - LEARNHOUSE_OSS=true
      - NEXT_PUBLIC_LEARNHOUSE_OSS=true
      - LEARNHOUSE_COOKIE_DOMAIN=.trycloudflare.com
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - learnhouse_content:/app/api/content
    ports:
      - "3001:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: learnhouse-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://learnhouse-app:80
    depends_on:
      learnhouse-app:
        condition: service_started

  init-admin:
    image: ordia-learning:latest
    container_name: learnhouse-init-admin
    depends_on:
      learnhouse-app:
        condition: service_healthy
    environment:
      - LEARNHOUSE_SQL_CONNECTION_STRING=postgresql://learnhouse:learnhouse_secure_2024@db:5432/learnhouse
      - LEARNHOUSE_AUTH_JWT_SECRET_KEY=ezr60eWBaqfkom4JoqP3q57UezYI6evWmQ/12oGcFJ4=
      - LEARNHOUSE_INITIAL_ADMIN_EMAIL=admin@ordia.fr
      - LEARNHOUSE_INITIAL_ADMIN_PASSWORD=OrdIA2026
      - LEARNHOUSE_INITIAL_ORG_NAME=OrdIA Learning
      - LEARNHOUSE_INITIAL_ORG_SLUG=default
      - LEARNHOUSE_REDIS_CONNECTION_STRING=redis://redis:6379/learnhouse
      - LEARNHOUSE_DEVELOPMENT_MODE=false
      - LEARNHOUSE_OSS=true
    command: >
      sh -c "sleep 25 && cd /app/api && uv run python cli.py install --short && echo 'INIT ADMIN DONE'"
    restart: "no"

  db:
    image: pgvector/pgvector:pg16
    container_name: learnhouse-db-prod
    restart: unless-stopped
    environment:
      - POSTGRES_USER=learnhouse
      - POSTGRES_PASSWORD=learnhouse_secure_2024
      - POSTGRES_DB=learnhouse
    volumes:
      - learnhouse_db_final_v4:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnhouse"]
      interval: 5s
      timeout: 4s
      retries: 5

  redis:
    image: redis:7.2.3-alpine
    container_name: learnhouse-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - learnhouse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 4s
      retries: 5

volumes:
  learnhouse_db_final_v4:
  learnhouse_redis_data:
  learnhouse_content:
